[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "model2mc"
version = "0.1.0"
description = "Turn 3D models (GLB, glTF, OBJ) into Minecraft builds: schematics, structure files and a voxel dump."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stink-O" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "trimesh>=4.0", "pillow>=10.1"]
keywords = ["minecraft", "voxel", "gltf", "glb", "obj", "schematic", "worldedit", "3d"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.optional-dependencies]
dev = ["pytest", "nbtlib>=2.0"]
display = ["fast-simplification>=0.1.9"]

[project.scripts]
model2mc = "model2mc.cli:main"

[project.urls]
Homepage = "https://github.com/Stink-O/model2mc"
Source = "https://github.com/Stink-O/model2mc"
Issues = "https://github.com/Stink-O/model2mc/issues"

[tool.setuptools]
packages = ["model2mc"]

[tool.setuptools.package-data]
model2mc = ["blocks.json"]
